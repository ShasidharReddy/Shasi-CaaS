name: Release Shasi Technologies

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: shasi-technologies-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine next version
        id: bump
        shell: bash
        run: |
          # Get latest tag version, fallback to VERSION file
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -z "$latest_tag" ]; then
            latest_tag=$(cat VERSION)
          fi
          IFS='.' read -r major minor patch <<< "$latest_tag"
          next_version="$major.$minor.$((patch + 1))"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
          echo "Latest: $latest_tag → Next: $next_version"

      - name: Create release tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shasidhar19/shasi-technologies:${{ steps.bump.outputs.version }}
            shasidhar19/shasi-technologies:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Docker image: \`shasidhar19/shasi-technologies:${VERSION}\`" \
            --latest
